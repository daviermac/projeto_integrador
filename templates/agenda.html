{% extends "base.html" %}

{% block title %}Agenda - Gerenciador de Tarefas Escolares{% endblock %}

{% block head_extra %}
<link href='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.css' rel='stylesheet' />
<script src='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js'></script>
<style>
    #calendar {
        max-width: 100%;
        margin: 0 auto;
    }
    .fc-event {
        cursor: pointer;
    }
    .fc-event:hover {
        opacity: 0.8;
    }
    .modal {
        display: none;
        position: fixed;
        z-index: 1000;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0, 0, 0, 0.5);
    }
    .modal-content {
        background-color: #fefefe;
        margin: 15% auto;
        padding: 20px;
        border: 1px solid #888;
        width: 90%;
        max-width: 500px;
        border-radius: 8px;
    }
    .dark .modal-content {
        background-color: #1f2937;
        color: #f3f4f6;
    }
</style>
{% endblock %}

{% block content %}
<div class="max-w-7xl mx-auto">
    <div class="bg-white dark:bg-gray-800 rounded-lg shadow-md p-6 mb-6">
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-3xl font-bold text-gray-900 dark:text-white">Minha Agenda</h1>
            <button onclick="abrirModalEvento()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg font-medium transition-colors">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 inline mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
                </svg>
                Novo Evento
            </button>
        </div>

        <!-- Calendário -->
        <div id='calendar'></div>
    </div>
</div>

<!-- Modal para criar evento -->
<div id="modal-evento" class="modal">
    <div class="modal-content">
        <div class="flex justify-between items-center mb-4">
            <h2 class="text-xl font-semibold">Criar Novo Evento</h2>
            <button onclick="fecharModal()" class="text-gray-500 hover:text-gray-700 dark:text-gray-400 dark:hover:text-gray-200">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                </svg>
            </button>
        </div>
        <form id="evento-form" method="POST" action="{{ url_for('criar_evento') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                <div>
                    <label for="titulo" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Título *</label>
                    <input type="text" id="titulo" name="titulo" required
                           class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 dark:bg-gray-600 dark:text-white">
                </div>
                <div>
                    <label for="data_inicio" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Data e Hora de Início *</label>
                    <input type="datetime-local" id="data_inicio" name="data_inicio" required
                           class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 dark:bg-gray-600 dark:text-white">
                </div>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                <div>
                    <label for="data_fim" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Data e Hora de Fim</label>
                    <input type="datetime-local" id="data_fim" name="data_fim"
                           class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 dark:bg-gray-600 dark:text-white">
                </div>
                <div>
                    <label for="local" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Local</label>
                    <input type="text" id="local" name="local"
                           class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 dark:bg-gray-600 dark:text-white">
                </div>
            </div>
            <div class="mb-4">
                <label for="descricao" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Descrição</label>
                <textarea id="descricao" name="descricao" rows="3"
                          class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 dark:bg-gray-600 dark:text-white"></textarea>
            </div>
            <div class="flex justify-end space-x-3">
                <button type="button" onclick="fecharModal()" class="px-4 py-2 text-gray-700 dark:text-gray-300 bg-gray-200 dark:bg-gray-600 rounded-md hover:bg-gray-300 dark:hover:bg-gray-500 transition-colors">
                    Cancelar
                </button>
                <button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700 transition-colors">
                    Criar Evento
                </button>
            </div>
        </form>
    </div>
</div>

<!-- Modal para visualizar evento -->
<div id="modal-visualizar" class="modal">
    <div class="modal-content">
        <div class="flex justify-between items-center mb-4">
            <h2 id="evento-titulo" class="text-xl font-semibold"></h2>
            <div class="flex space-x-2">
                <button onclick="deletarEvento()" class="text-red-600 hover:text-red-800 dark:text-red-400 dark:hover:text-red-200">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                    </svg>
                </button>
                <button onclick="fecharModalVisualizar()" class="text-gray-500 hover:text-gray-700 dark:text-gray-400 dark:hover:text-gray-200">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                    </svg>
                </button>
            </div>
        </div>
        <div id="evento-detalhes"></div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    var calendarEl = document.getElementById('calendar');
    var calendar = new FullCalendar.Calendar(calendarEl, {
        initialView: 'dayGridMonth',
        locale: 'pt-br',
        headerToolbar: {
            left: 'prev,next today',
            center: 'title',
            right: 'dayGridMonth,timeGridWeek,timeGridDay'
        },
        buttonText: {
            today: 'Hoje',
            month: 'Mês',
            week: 'Semana',
            day: 'Dia'
        },
        events: {{ eventos_json|safe }},
        eventClick: function(info) {
            mostrarEvento(info.event);
        },
        dateClick: function(info) {
            // Preencher data no formulário quando clicar em uma data
            document.getElementById('data_inicio').value = info.dateStr + 'T09:00';
            abrirModalEvento();
        },
        height: 'auto',
        dayMaxEvents: true,
        moreLinkClick: 'popover'
    });
    calendar.render();
});

function abrirModalEvento() {
    document.getElementById('modal-evento').style.display = 'block';
    document.getElementById('titulo').focus();
}

function fecharModal() {
    document.getElementById('modal-evento').style.display = 'none';
    document.getElementById('evento-form').reset();
}

function mostrarEvento(event) {
    document.getElementById('evento-titulo').textContent = event.title;

    var detalhes = '<div class="space-y-2">';
    detalhes += '<p><strong>Data de início:</strong> ' + event.start.toLocaleString('pt-BR') + '</p>';
    if (event.end) {
        detalhes += '<p><strong>Data de fim:</strong> ' + event.end.toLocaleString('pt-BR') + '</p>';
    }
    if (event.extendedProps.local) {
        detalhes += '<p><strong>Local:</strong> ' + event.extendedProps.local + '</p>';
    }
    if (event.extendedProps.descricao) {
        detalhes += '<p><strong>Descrição:</strong> ' + event.extendedProps.descricao + '</p>';
    }
    detalhes += '</div>';

    document.getElementById('evento-detalhes').innerHTML = detalhes;
    document.getElementById('modal-visualizar').style.display = 'block';

    // Armazenar ID do evento para edição/deleção
    window.eventoAtual = event;
}

function fecharModalVisualizar() {
    document.getElementById('modal-visualizar').style.display = 'none';
}

function deletarEvento() {
    if (confirm('Tem certeza que deseja deletar este evento?')) {
        var form = document.createElement('form');
        form.method = 'POST';
        form.action = '/deletar_evento/' + window.eventoAtual.id;

        var csrfInput = document.createElement('input');
        csrfInput.type = 'hidden';
        csrfInput.name = 'csrf_token';
        csrfInput.value = '{{ csrf_token() }}';
        form.appendChild(csrfInput);

        document.body.appendChild(form);
        form.submit();
    }
}

// Fechar modais ao clicar fora
window.onclick = function(event) {
    var modalEvento = document.getElementById('modal-evento');
    var modalVisualizar = document.getElementById('modal-visualizar');

    if (event.target == modalEvento) {
        fecharModal();
    }
    if (event.target == modalVisualizar) {
        fecharModalVisualizar();
    }
}
</script>
{% endblock %}
